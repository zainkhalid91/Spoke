<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="wf.css"><script src="wheel.js"></script><script src="items.js"></script>
<style>
.cols{display:flex;gap:16px;height:100%}
.wl{width:170px;display:flex;flex-direction:column;gap:6px}
.wl .w{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:1px solid #262a31;font:13px var(--ui);color:var(--tx2)}
.wl .w i{width:10px;height:10px;border-radius:50%}
.wl .w.on{background:#22252c;color:var(--tx);border-color:#3a3f4a}
.wl .w small{margin-left:auto;font:10px var(--mono);color:var(--tx3)}
.ctr{flex:1;position:relative}
.ins{width:300px;border-left:1px solid #23262c;padding-left:16px;display:flex;flex-direction:column;gap:7px;padding-bottom:70px}
.ins label{font:11px var(--mono);letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin-bottom:-4px}
.list{position:absolute;left:0;right:0;top:318px}
.li{display:flex;align-items:center;gap:10px;height:28px;padding:0 10px;border-bottom:1px solid #22252b;font-size:13px;color:var(--tx2);background:#16181c}
.li .h{color:var(--tx3);font-family:var(--mono);cursor:grab}
.li .n{font:11px var(--mono);color:var(--tx3);width:14px}
.li .t{margin-left:auto;font:11px var(--mono);color:var(--tx3)}
.li.drag{position:relative;left:18px;top:-6px;background:#262a32;border:1px solid var(--acc);border-radius:6px;box-shadow:0 10px 24px #000b;color:var(--tx);z-index:2}
.li.gapline{height:3px;background:var(--acc);padding:0;border:0;margin:0 10px;border-radius:2px}
.tb{display:flex;gap:8px;align-items:center;margin-bottom:10px}
</style></head><body>
<script>
shell("Wheels",`
<div class="tb"><h1 style="margin:0">Wheels</h1><span class="chip" style="margin-left:10px">SAVED · LIVE</span><span style="margin-left:auto" class="btn">Import .spoke</span><span class="btn">Export</span><span class="btn pri">+ New wheel</span></div>
<div class="cols">
 <div class="wl">

 </div>
 <div class="ins">

  <div style="margin-top:auto;display:flex;gap:8px"><span class="btn">Test ▸</span><span class="btn" style="margin-left:auto;color:#fb7185">Clear slice</span></div>
 </div>
</div>`,"07 · Settings → Wheels (editor, drag to reorder)");
spokeWheel(document.body,{cx:672,cy:312,rOut:116,rIn:52,hubSize:42,items:DEV_ITEMS(),hover:1,hub:{t:"DEV",s:"PREVIEW"}});
</script>
<div class="note" style="left:290px;top:560px;max-width:170px;font-size:11px"><b>Reorder</b> by dragging in the list <i>or</i> directly on the wheel. <b>Drop</b> an app, file, folder or URL onto a slice to fill it. Undo with Ctrl+Z.</div>
</body></html>
